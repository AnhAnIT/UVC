workflows:
  my-workflow-id: # ID hoặc tên của luồng build (vd: ios-build, android-build)
    name: Build & Test Workflow # Tên hiển thị trên giao diện Codemagic
    instance_type: mac_mini_m1 # Cấu hình máy chủ build (mac_mini_m1, mac_pro, v.v.)
    max_build_duration: 60 # Thời gian tối đa cho 1 lượt build (phút)
    
    # 1. Khai báo biến môi trường (API Key, Mật khẩu, Token...)
    environment:
      groups:
        - my_environment_variables
      vars:
        APP_ID: "com.example.app"
      flutter: default # Nếu dùng Flutter (định nghĩa phiên bản)
      xcode: latest # Định nghĩa phiên bản Xcode (cho iOS/macOS)
      cocoapods: default

    # 2. Các bước thực thi (Scripts/Commands)
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get # Hoặc npm install, pod install... tùy vào công nghệ
      - name: Run Tests
        script: |
          flutter test
      - name: Build Application
        script: |
          flutter build ipa --release # Hoặc lệnh build app native iOS / Android

    # 3. Quản lý Artifacts (File đầu ra sau khi build xong)
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "*.app"
      - "build/**/outputs/**/*.apk"