workflows:
  unity-build:
    name: Unity Build Workflow
    instance_type: mac_mini_m1 # Hoặc mac_mini_m2 tùy theo tài khoản của bạn
    max_build_duration: 60
    
    environment:
      vars:
        # Tên project Unity của bạn
        UNITY_BIN: "/Applications/Unity/Hub/Editor/2022.3.0f1/Editor/Unity" # Điều chỉnh đúng phiên bản Unity cài trên runner
      xcode: latest
      cocoapods: default

    scripts:
      - name: Build Unity Project
        script: |
          echo "Building Unity Project..."
          # Thực thi lệnh build Unity ở chế độ Batchmode (không giao diện)
          # Lưu ý: Cần có file BuildScript trong Unity nếu bạn gọi Custom Build Method, 
          # hoặc sử dụng Unity Standalone/Mobile build command.
          
          # Ví dụ build ra Xcode project cho iOS:
          # $UNITY_BIN -batchmode -quit -projectPath . -buildTarget iOS -executeMethod BuildScript.BuildiOS
          
          # Nếu dự án xuất thẳng ra file build Xcode / Android APK:
          echo "Unity build step completed."

      - name: Install Pods (Dành cho iOS output)
        script: |
          # Nếu Unity export ra thư mục iOS build:
          # cd Build_iOS && pod install
          echo "Installing pods if applicable..."

    artifacts:
      - "Builds/**/*.apk"
      - "Builds/**/*.aab"
      - "Builds/**/*.ipa"
      - "*.app"